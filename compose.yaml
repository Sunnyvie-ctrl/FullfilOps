services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillops_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: fulfillops_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillops_user -d fulfillops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
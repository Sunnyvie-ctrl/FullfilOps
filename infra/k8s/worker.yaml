# FulfillOps outbox worker: 2 replicas. SKIP LOCKED in worker.py makes it safe
# for both replicas to poll outbox_jobs at the same time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillops-worker
    spec:
      # worker.py catches SIGTERM and finishes its current batch before exiting.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fulfillops-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fulfillops-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fulfillops-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          # The worker has no HTTP port. Its loop rewrites a heartbeat file
          # (WORKER_HEARTBEAT_FILE) every iteration; if the file is older than
          # 60s the loop is stuck -> Kubernetes restarts the pod.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Ready once the loop has run at least once.
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/worker-heartbeat"]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

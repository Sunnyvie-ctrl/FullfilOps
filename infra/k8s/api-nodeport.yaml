# Exposes the API on node port 30080 -> localhost:8080 (see infra/kind/kind-config.yaml).
# Traffic goes through the Service, so only READY pods receive requests.
apiVersion: v1
kind: Service
metadata:
  name: fulfillops-api-nodeport
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fulfillops-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080

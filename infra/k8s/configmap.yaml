# Non-secret settings. Passwords live in the Secret "fulfillops-db" (not in Git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulfillops-config
data:
  POSTGRES_DB: fulfillops_db
  DB_HOST: postgres
  DB_PORT: "5432"
  LOG_LEVEL: INFO
  WORKER_BATCH_SIZE: "10"
  WORKER_POLL_INTERVAL: "1.0"
  WORKER_MAX_ATTEMPTS: "5"
  WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat

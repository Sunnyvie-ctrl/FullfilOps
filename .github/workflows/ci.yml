name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check worker tests
      - run: ruff check worker tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fulfillops_user
          POSTGRES_PASSWORD: secret_password
          POSTGRES_DB: fulfillops_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fulfillops_user -d fulfillops_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python scripts/reset-test-data.py
      - run: python -m pytest -v

  image:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: worker
            dockerfile: worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        if: hashFiles(matrix.dockerfile) != ''
        run: docker build -f ${{ matrix.dockerfile }} -t fulfillops-${{ matrix.name }}:${{ github.sha }} .
      - name: Generate SBOM (SPDX)
        if: hashFiles(matrix.dockerfile) != ''
        uses: anchore/sbom-action@v0
        with:
          image: fulfillops-${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false
      - name: Vulnerability scan (fails on HIGH or CRITICAL)
        if: hashFiles(matrix.dockerfile) != ''
        # Pinned by commit SHA: trivy-action tags were hijacked in the March 2026
        # supply-chain attack, and v0.33.1 installs a Trivy release that was deleted.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: fulfillops-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SBOM
        if: hashFiles(matrix.dockerfile) != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
